<!DOCTYPE html>
<html>
<head>
  <title>Google Search Console 验证</title>
  <!-- 
    请在 Google Search Console 中获取 meta 验证标签后，
    替换下面这行的 content 值
  -->

</head>
<body>
  <p>Google Search Console verification file.</p>
</body>
</html>
